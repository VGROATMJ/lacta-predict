<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk - Lacta-Predict</title>
<meta name="theme-color" content="#1b4332">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<style>
  :root{
    color-scheme:light;
    --green-dark:#1b4332; --green:#2d6a4f; --green-soft:#e9f3ec; --lime:#a7c957;
    --bg:#f3f6f1; --card:#ffffff; --surface:#f8faf7; --text:#183a29; --muted:#718078;
    --border:#e2e9e2; --input-border:#d4ddd4; --red-bg:#fdeaea; --red-text:#a33;
    --shadow:0 10px 40px rgba(20,50,30,.12);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --green-dark:#a7d7b8; --green:#76b88e; --green-soft:#20372a; --lime:#c1e58a;
    --bg:#101813; --card:#18231c; --surface:#202d24; --text:#edf5ef; --muted:#a5b8aa;
    --border:#304236; --input-border:#405747; --red-bg:#3b2525; --red-text:#ffaaaa;
    --shadow:0 12px 42px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;
    padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
  .card{width:100%;max-width:390px;background:var(--card);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow);padding:34px 22px 26px}
  .logo{width:64px;height:64px;border-radius:50%;background:var(--green-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .logo svg{stroke:var(--green-dark)}
  h1{font-size:22px;text-align:center;margin:0 0 4px}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
  h2{font-size:16px;text-align:center;margin:0 0 6px}
  label{font-size:12.5px;font-weight:600;display:block;margin:12px 0 6px}
  input{width:100%;padding:13px 14px;border:1px solid var(--input-border);border-radius:10px;background:var(--surface);color:var(--text);font-size:14px}
  input::placeholder{color:var(--muted);opacity:.8}
  .btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:16px;background:var(--green-dark);color:#fff}
  :root[data-theme="dark"] .btn{background:#397451}
  .btn.outline{background:transparent;color:var(--green-dark);border:1.5px solid var(--green-dark)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  button:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
  .row{text-align:center;font-size:12.5px;color:var(--muted);margin-top:16px}
  .link{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--green-dark);cursor:pointer}
  .hint{font-size:11px;color:var(--muted);margin-top:4px}
  .msg{font-size:12px;line-height:1.45;border-radius:10px;padding:10px 12px;margin-top:12px;background:var(--surface);border:1px solid var(--border)}
  .msg.err{background:var(--red-bg);color:var(--red-text);border-color:transparent}
  .msg.ok{background:var(--green-soft);color:var(--green-dark);border-color:transparent}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M4 15c3-5 13-5 16 0"/></svg>
  </div>
  <h1>Lacta-Predict</h1>
  <div class="sub">Prediksi produksi susu sapi perah</div>

  <!-- FORM LOGIN / DAFTAR / RESET -->
  <section id="formView" hidden>
    <h2 id="heading"></h2>
    <form id="authForm" novalidate>
      <div id="nameGroup" hidden>
        <label for="name">Nama</label>
        <input id="name" autocomplete="name" maxlength="60" placeholder="Nama lengkap">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="Masukkan email">
      <div id="passGroup">
        <label for="password">Kata Sandi</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi">
      </div>
      <div id="confirmGroup" hidden>
        <label for="password2">Ulangi Kata Sandi</label>
        <input id="password2" type="password" autocomplete="new-password" placeholder="Ulangi kata sandi">
      </div>
      <div class="hint" id="passHint" hidden>Minimal 8 karakter, kombinasi huruf dan angka.</div>
      <div class="msg" id="msg" role="alert" hidden></div>
      <button class="btn" id="submitBtn" type="submit">Masuk</button>
    </form>
    <div class="row" id="forgotRow"><button class="link" id="forgotBtn" type="button">Lupa kata sandi?</button></div>
    <div class="row"><span id="toggleText"></span> <button class="link" id="toggleBtn" type="button"></button></div>
  </section>

  <!-- BELUM TERVERIFIKASI -->
  <section id="verifyView" hidden>
    <h2>Verifikasi Email</h2>
    <div class="sub" style="margin-bottom:0">Akun <b id="verifyEmail"></b> belum diverifikasi. Klik tautan di email Anda (cek juga folder spam), lalu tekan tombol di bawah.</div>
    <div class="msg" id="verifyMsg" role="alert" hidden></div>
    <button class="btn" id="checkBtn" type="button">Saya Sudah Verifikasi</button>
    <button class="btn outline" id="resendBtn" type="button">Kirim Ulang Email Verifikasi</button>
    <div class="row"><button class="link" id="backBtn" type="button">Pakai akun lain</button></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
(function () {
  'use strict';
  var APP_PAGE = 'index.html';              // halaman utama setelah login berhasil
  var THEME_KEY = 'lacta_predict_theme_v1'; // sama dengan app utama
  var $ = function (id) { return document.getElementById(id); };
  var mode = 'login', auth = null, busy = false, timer = null;

  try { document.documentElement.setAttribute('data-theme', localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light'); } catch (e) {}

  var ERR = {
    'auth/invalid-email': 'Format email tidak valid.',
    'auth/user-disabled': 'Akun ini dinonaktifkan. Hubungi admin.',
    'auth/user-not-found': 'Email atau kata sandi salah.',
    'auth/wrong-password': 'Email atau kata sandi salah.',
    'auth/invalid-credential': 'Email atau kata sandi salah.',
    'auth/invalid-login-credentials': 'Email atau kata sandi salah.',
    'auth/email-already-in-use': 'Email ini sudah terdaftar. Silakan masuk.',
    'auth/weak-password': 'Kata sandi terlalu lemah. Gunakan minimal 8 karakter, kombinasi huruf dan angka.',
    'auth/too-many-requests': 'Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.',
    'auth/network-request-failed': 'Tidak ada koneksi internet. Periksa jaringan Anda.',
    'auth/operation-not-allowed': 'Login email/kata sandi belum diaktifkan di Firebase Console.',
    'auth/unauthorized-domain': 'Domain ini belum didaftarkan di Firebase (Authorized domains).'
  };
  function errText(e) { return (e && ERR[e.code]) || 'Terjadi kesalahan. Coba lagi sebentar lagi.'; }

  function msg(id, text, kind) {
    var el = $(id);
    if (!text) { el.hidden = true; el.textContent = ''; return; }
    el.textContent = text; el.className = 'msg' + (kind ? ' ' + kind : ''); el.hidden = false;
  }
  function busyOn(btn, label) { busy = true; btn.dataset.l = btn.textContent; btn.textContent = label; btn.disabled = true; }
  function busyOff(btn) { busy = false; btn.textContent = btn.dataset.l || btn.textContent; btn.disabled = false; }

  function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }
  function validPass(v) { return v.length >= 8 && /[A-Za-z]/.test(v) && /\d/.test(v); }

  function setMode(m, keepMsg) {
    mode = m;
    var reg = m === 'register', rst = m === 'reset';
    if (!keepMsg) msg('msg', '');
    $('formView').hidden = false; $('verifyView').hidden = true;
    $('heading').textContent = reg ? 'Buat akun baru' : rst ? 'Reset kata sandi' : 'Masuk';
    $('nameGroup').hidden = !reg; $('confirmGroup').hidden = !reg; $('passHint').hidden = !reg;
    $('passGroup').hidden = rst; $('forgotRow').hidden = reg || rst;
    $('password').setAttribute('autocomplete', reg ? 'new-password' : 'current-password');
    $('submitBtn').textContent = reg ? 'Daftar' : rst ? 'Kirim Tautan Reset' : 'Masuk';
    $('toggleText').textContent = reg ? 'Sudah punya akun?' : rst ? 'Ingat kata sandi?' : 'Belum punya akun?';
    $('toggleBtn').textContent = reg ? 'Masuk' : rst ? 'Kembali masuk' : 'Daftar';
  }

  function goApp() { window.location.replace(APP_PAGE); }

  function showVerify(user) {
    $('formView').hidden = true; $('verifyView').hidden = false;
    $('verifyEmail').textContent = user.email;
    msg('verifyMsg', '');
  }

  function onSubmit(ev) {
    ev.preventDefault();
    if (busy || !auth) return;
    var email = $('email').value.trim(), pass = $('password').value;
    msg('msg', '');
    if (!validEmail(email)) return msg('msg', 'Masukkan email yang valid.', 'err');
    if (mode === 'reset') return doReset(email);
    if (!pass) return msg('msg', 'Kata sandi belum diisi.', 'err');
    if (mode === 'register') {
      var name = $('name').value.trim().replace(/\s+/g, ' ');
      if (name.length < 2) return msg('msg', 'Nama minimal 2 karakter.', 'err');
      if (!validPass(pass)) return msg('msg', ERR['auth/weak-password'], 'err');
      if (pass !== $('password2').value) return msg('msg', 'Konfirmasi kata sandi tidak sama.', 'err');
      return doRegister(name, email, pass);
    }
    doLogin(email, pass);
  }

  function doLogin(email, pass) {
    var b = $('submitBtn'); busyOn(b, 'Masuk...');
    auth.signInWithEmailAndPassword(email, pass)
      .then(function (c) {
        $('password').value = '';
        if (c.user.emailVerified) goApp(); else showVerify(c.user);
      })
      .catch(function (e) { msg('msg', errText(e), 'err'); })
      .then(function () { busyOff(b); });
  }

  function doRegister(name, email, pass) {
    var b = $('submitBtn'), cred; busyOn(b, 'Mendaftar...');
    auth.createUserWithEmailAndPassword(email, pass)
      .then(function (c) { cred = c; return c.user.updateProfile({ displayName: name }).catch(function () {}); })
      .then(function () { return cred.user.sendEmailVerification().then(function () { return true; }, function () { return false; }); })
      .then(function (sent) {
        $('password').value = ''; $('password2').value = '';
        showVerify(cred.user);
        msg('verifyMsg', sent ? 'Pendaftaran berhasil. Tautan verifikasi sudah dikirim, cek inbox atau folder spam.'
                              : 'Akun dibuat, tetapi email verifikasi gagal dikirim. Tekan "Kirim Ulang Email Verifikasi".', sent ? 'ok' : 'err');
        if (sent) cooldown();
      })
      .catch(function (e) { msg('msg', errText(e), 'err'); })
      .then(function () { busyOff(b); });
  }

  function doReset(email) {
    var b = $('submitBtn'); busyOn(b, 'Mengirim...');
    auth.sendPasswordResetEmail(email)
      .then(function () { return null; }, function (e) { return e && e.code === 'auth/user-not-found' ? null : e; })
      .then(function (e) {
        if (e) msg('msg', errText(e), 'err');
        else msg('msg', 'Jika email terdaftar, tautan reset kata sandi sudah dikirim. Cek inbox atau folder spam.', 'ok');
      })
      .then(function () { busyOff(b); });
  }

  function cooldown() {
    var b = $('resendBtn'), left = 60; clearInterval(timer);
    b.disabled = true; b.textContent = 'Kirim ulang dalam ' + left + ' dtk';
    timer = setInterval(function () {
      if (--left <= 0) { clearInterval(timer); b.disabled = false; b.textContent = 'Kirim Ulang Email Verifikasi'; }
      else b.textContent = 'Kirim ulang dalam ' + left + ' dtk';
    }, 1000);
  }
  function resend() {
    var u = auth.currentUser; if (!u) return;
    $('resendBtn').disabled = true;
    u.sendEmailVerification()
      .then(function () { msg('verifyMsg', 'Email verifikasi dikirim ulang ke ' + u.email + '.', 'ok'); cooldown(); })
      .catch(function (e) { msg('verifyMsg', errText(e), 'err'); $('resendBtn').disabled = false; });
  }
  function check(silent) {
    var u = auth && auth.currentUser; if (!u) return;
    var b = $('checkBtn'); if (!silent) busyOn(b, 'Memeriksa...');
    u.reload().then(function () { return u.getIdToken(true); })
      .then(function () {
        if (auth.currentUser.emailVerified) goApp();
        else if (!silent) msg('verifyMsg', 'Email belum terverifikasi. Klik tautan di email Anda terlebih dahulu.', 'err');
      })
      .catch(function (e) { if (!silent) msg('verifyMsg', errText(e), 'err'); })
      .then(function () { if (!silent) busyOff(b); });
  }

  function init() {
    $('authForm').addEventListener('submit', onSubmit);
    $('toggleBtn').addEventListener('click', function () { setMode(mode === 'login' ? 'register' : 'login'); });
    $('forgotBtn').addEventListener('click', function () { setMode('reset'); });
    $('resendBtn').addEventListener('click', resend);
    $('checkBtn').addEventListener('click', function () { check(false); });
    $('backBtn').addEventListener('click', function () { clearInterval(timer); auth.signOut().then(function () { setMode('login'); }); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden && !$('verifyView').hidden) check(true); });
    setMode('login');

    if (!window.firebase || !window.LACTA_FIREBASE_CONFIG) {
      $('submitBtn').disabled = true;
      return msg('msg', 'Layanan login tidak dapat dimuat. Periksa koneksi internet lalu muat ulang.', 'err');
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp(window.LACTA_FIREBASE_CONFIG);
      auth = firebase.auth(); auth.languageCode = 'id';
    } catch (e) { $('submitBtn').disabled = true; return msg('msg', 'Gagal menginisialisasi layanan login.', 'err'); }

    // Jika sesi sudah ada: terverifikasi -> langsung ke aplikasi; belum -> layar verifikasi.
    var first = true;
    auth.onAuthStateChanged(function (u) {
      if (!first) return; first = false;
      if (u && u.emailVerified) goApp(); else if (u) showVerify(u);
    });
  }
  init();
})();
</script>
</body>
</html>
